{% load wagtailimages_tags %}
<figure class="editorial-image">
    {% image value.image width-1400 class="editorial-image__asset" %}
    {% if value.caption or value.attribution %}<figcaption>{% if value.caption %}{{ value.caption }}{% endif %}{% if value.attribution %}<span> — {{ value.attribution }}</span>{% endif %}</figcaption>{% endif %}
</figure>
