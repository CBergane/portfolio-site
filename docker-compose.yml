version: '3.8'

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: portfolio_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: portfolio_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: portfolio_web
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_URL: postgres://portfolio_user:${POSTGRES_PASSWORD}@db:5432/portfolio_db
      INIT_WAGTAIL_HOME: "0"
      CACHE_URL: redis://redis:6379/1
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      HTB_TOKEN: ${HTB_TOKEN}
      HTB_USER_ID: ${HTB_USER_ID}
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "4"
      GUNICORN_TIMEOUT: "90"
      GUNICORN_KEEP_ALIVE: "5"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    networks:
      - portfolio_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8000)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: docker.io/library/nginx:1.29-alpine
    container_name: portfolio_nginx
    ports:
      - "127.0.0.1:80:8080"
    volumes:
      - static_files:/static:ro
      - media_files:/media:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - portfolio_network
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Host: cbergane.se' --header='X-Forwarded-Proto: https' http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  static_files:
  media_files:

networks:
  portfolio_network:
    driver: bridge
